name: LangGraph isolated prototype tests

on:
  pull_request:
    paths:
      - "runtime/papi_core/langgraph_demo.py"
      - "tests/test_langgraph_demo.py"
      - ".github/workflows/langgraph-prototype.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langgraph-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install core and pinned optional dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "langgraph==0.2.76"
      - name: Run LangGraph prototype tests
        env:
          PYTHONPATH: runtime
        run: python -m unittest discover -s tests -p "test_langgraph_demo.py" -v
