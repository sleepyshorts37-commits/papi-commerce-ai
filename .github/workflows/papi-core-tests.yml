name: PAPI core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: papi_test_password
          POSTGRES_DB: papi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python --version
      - name: Create isolated runtime environment
        run: python -m venv /tmp/papi-runtime
      - name: Install runtime dependencies
        run: /tmp/papi-runtime/bin/python -m pip install -r requirements.txt
      - name: Check runtime dependency consistency
        run: /tmp/papi-runtime/bin/python -m pip check
      - name: Audit runtime dependency graph
        run: |
          python -m venv /tmp/papi-dependency-audit
          /tmp/papi-dependency-audit/bin/python -m pip install --disable-pip-version-check pip-audit==2.10.1
          /tmp/papi-dependency-audit/bin/pip-audit --strict -r requirements.txt
          /tmp/papi-dependency-audit/bin/pip-audit --strict
      - name: Validate registries
        run: PYTHONPATH=runtime /tmp/papi-runtime/bin/python -m papi_core validate
      - name: Run unit tests
        run: PYTHONPATH=runtime /tmp/papi-runtime/bin/python -m unittest discover -s tests -v

      - name: Apply base Supabase schema to disposable PostgreSQL
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/schema.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as first_use \gset
          \if :first_use
          \else
            \quit 1
          \endif
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as replay_use \gset
          \if :replay_use
            \quit 1
          \endif
          SQL

      - name: Restore legacy queue schema and seed compatibility fixtures
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/202611170001_durable_job_attempt_ids.down.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.papi_tasks(id, task, version)
          values
            ('legacy-done-task', '{"id":"legacy-done-task"}'::jsonb, 1),
            ('legacy-running-task', '{"id":"legacy-running-task"}'::jsonb, 1);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, status, attempts, max_attempts
          ) values
            ('legacy-done-job', 'legacy-done-task', 'test.noop', '{}'::jsonb,
             'legacy-done-key', 'done', 2, 5);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, status, attempts, max_attempts,
            lease_owner, lease_token, lease_until
          ) values (
            'legacy-running-job', 'legacy-running-task', 'test.noop', '{}'::jsonb,
            'legacy-running-key', 'running', 1, 5, 'legacy-worker',
            gen_random_uuid(), now() + interval '10 minutes'
          );
          SQL

      - name: Apply durable attempt migration and verify history, recovery and statuses
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/202611170001_durable_job_attempt_ids.up.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          do $legacy$
          declare
            legacy_status text;
            legacy_flag boolean;
            legacy_finished timestamptz;
          begin
            select status, is_legacy, finished_at
              into legacy_status, legacy_flag, legacy_finished
              from public.papi_job_attempts where job_id = 'legacy-done-job';
            if not found or legacy_status <> 'completed' or legacy_flag is not true
               or legacy_finished is null then
              raise exception 'completed legacy job was not conservatively backfilled';
            end if;

            select status, is_legacy, finished_at
              into legacy_status, legacy_flag, legacy_finished
              from public.papi_job_attempts where job_id = 'legacy-running-job';
            if not found or legacy_status <> 'running' or legacy_flag is not true
               or legacy_finished is not null then
              raise exception 'running legacy job was not backfilled as running';
            end if;
          end;
          $legacy$;

          insert into public.papi_tasks(id, task, version)
          values ('attempt-ci-task', '{"id":"attempt-ci-task"}'::jsonb, 1);
          insert into public.papi_jobs(id, task_id, handler, payload, idempotency_key)
          values ('attempt-ci-job', 'attempt-ci-task', 'test.noop', '{}'::jsonb, 'attempt-ci-key');

          do $attempt$
          declare
            first_claim jsonb;
            second_claim jsonb;
            attempt_count integer;
            previous_status text;
            current_status text;
            completed boolean;
          begin
            first_claim := public.papi_claim_job('worker-ci-1', gen_random_uuid(), 15);
            if first_claim is null or first_claim->>'attempt_id' is null then
              raise exception 'first reservation did not return attempt_id';
            end if;

            update public.papi_jobs set lease_until = now() - interval '1 second'
             where id = 'attempt-ci-job';
            second_claim := public.papi_claim_job('worker-ci-2', gen_random_uuid(), 15);
            if second_claim is null or second_claim->>'attempt_id' is null then
              raise exception 'expired reservation was not reclaimed';
            end if;
            if first_claim->>'attempt_id' = second_claim->>'attempt_id' then
              raise exception 'separate reservations reused attempt_id';
            end if;

            select count(*) into attempt_count from public.papi_job_attempts
             where job_id = 'attempt-ci-job';
            if attempt_count <> 2 then
              raise exception 'expected two attempt history rows, got %', attempt_count;
            end if;
            select status into previous_status from public.papi_job_attempts
             where attempt_id = (first_claim->>'attempt_id')::uuid;
            if previous_status <> 'lease_expired' then
              raise exception 'previous attempt status was %, expected lease_expired', previous_status;
            end if;
            select status into current_status from public.papi_job_attempts
             where attempt_id = (second_claim->>'attempt_id')::uuid;
            if current_status <> 'running' then
              raise exception 'new attempt status was %, expected running', current_status;
            end if;

            if not public.papi_renew_job(
              'attempt-ci-job', 'worker-ci-2', (second_claim->>'lease_token')::uuid, 60
            ) then
              raise exception 'current lease could not be renewed';
            end if;
            if public.papi_renew_job(
              'attempt-ci-job', 'worker-ci-1', (first_claim->>'lease_token')::uuid, 60
            ) then
              raise exception 'stale worker renewed a replaced lease';
            end if;
            if public.papi_complete_job(
              'attempt-ci-job', 'worker-ci-1', (first_claim->>'lease_token')::uuid,
              '{"stale":true}'::jsonb
            ) then
              raise exception 'stale worker completed a replaced lease';
            end if;

            completed := public.papi_complete_job(
              'attempt-ci-job', 'worker-ci-2', (second_claim->>'lease_token')::uuid,
              '{"verified":true}'::jsonb
            );
            if not completed then
              raise exception 'current lease could not complete its job';
            end if;
            select status into current_status from public.papi_job_attempts
             where attempt_id = (second_claim->>'attempt_id')::uuid;
            if current_status <> 'completed' then
              raise exception 'completed attempt status was %, expected completed', current_status;
            end if;
          end;
          $attempt$;

          insert into public.papi_tasks(id, task, version)
          values ('retry-ci-task', '{"id":"retry-ci-task"}'::jsonb, 1);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, max_attempts
          ) values (
            'retry-ci-job', 'retry-ci-task', 'test.noop', '{}'::jsonb,
            'retry-ci-key', 3
          );
          do $retry$
          declare
            first_claim jsonb;
            second_claim jsonb;
            fail_status text;
            previous_status text;
            current_status text;
          begin
            first_claim := public.papi_claim_job('worker-ci-retry-1', gen_random_uuid(), 15);
            if first_claim is null or first_claim->>'id' <> 'retry-ci-job' then
              raise exception 'retry fixture was not initially claimed';
            end if;

            fail_status := public.papi_fail_job(
              'retry-ci-job', 'worker-ci-retry-1',
              (first_claim->>'lease_token')::uuid, 'transient_error'
            );
            if fail_status <> 'retry' then
              raise exception 'expected retry transition, got %', fail_status;
            end if;
            select status into previous_status from public.papi_job_attempts
             where attempt_id = (first_claim->>'attempt_id')::uuid;
            if previous_status <> 'retry' then
              raise exception 'failed attempt status was %, expected retry', previous_status;
            end if;

            update public.papi_jobs set available_at = now()
             where id = 'retry-ci-job';
            second_claim := public.papi_claim_job('worker-ci-retry-2', gen_random_uuid(), 15);
            if second_claim is null or second_claim->>'id' <> 'retry-ci-job'
               or second_claim->>'attempt_id' = first_claim->>'attempt_id' then
              raise exception 'retry reservation did not create a distinct attempt';
            end if;

            select status into previous_status from public.papi_job_attempts
             where attempt_id = (first_claim->>'attempt_id')::uuid;
            select status into current_status from public.papi_job_attempts
             where attempt_id = (second_claim->>'attempt_id')::uuid;
            if previous_status <> 'retry' or current_status <> 'running' then
              raise exception 'retry history statuses are %, %', previous_status, current_status;
            end if;
          end;
          $retry$;

          insert into public.papi_tasks(id, task, version)
          values ('exhausted-ci-task', '{"id":"exhausted-ci-task"}'::jsonb, 1);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, max_attempts
          ) values (
            'exhausted-ci-job', 'exhausted-ci-task', 'test.noop', '{}'::jsonb,
            'exhausted-ci-key', 1
          );
          do $exhausted$
          declare
            claimed jsonb;
            next_claim jsonb;
            job_status text;
            attempt_status text;
          begin
            claimed := public.papi_claim_job('worker-ci-max', gen_random_uuid(), 15);
            if claimed is null or claimed->>'id' <> 'exhausted-ci-job' then
              raise exception 'max-attempt fixture was not claimed';
            end if;
            update public.papi_jobs set lease_until = now() - interval '1 second'
             where id = 'exhausted-ci-job';
            next_claim := public.papi_claim_job('worker-ci-next', gen_random_uuid(), 15);
            if next_claim is not null then
              raise exception 'job with exhausted attempts was reserved again';
            end if;
            select status into job_status from public.papi_jobs where id = 'exhausted-ci-job';
            select status into attempt_status from public.papi_job_attempts
             where attempt_id = (claimed->>'attempt_id')::uuid;
            if job_status <> 'failed' or attempt_status <> 'failed' then
              raise exception 'exhausted job/attempt statuses are %, %', job_status, attempt_status;
            end if;
          end;
          $exhausted$;
          SQL

      - name: Verify concurrent claims skip locked rows on disposable PostgreSQL
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.papi_tasks(id, task, version)
          values
            ('concurrent-first-task', '{"id":"concurrent-first-task"}'::jsonb, 1),
            ('concurrent-second-task', '{"id":"concurrent-second-task"}'::jsonb, 1);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, available_at, created_at
          ) values
            ('concurrent-first-job', 'concurrent-first-task', 'test.noop', '{}'::jsonb,
             'concurrent-first-key', now(), now() - interval '2 minutes'),
            ('concurrent-second-job', 'concurrent-second-task', 'test.noop', '{}'::jsonb,
             'concurrent-second-key', now(), now() - interval '1 minute');
          SQL

          # Hold the oldest queued row in a separate transaction while another
          # worker executes the real claim RPC. SKIP LOCKED must choose the next row.
          rm -f /tmp/papi-lock-ready
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 > /tmp/papi-lock-holder.log 2>&1 <<'SQL' &
          begin;
          select id from public.papi_jobs where id = 'concurrent-first-job' for update;
          \! touch /tmp/papi-lock-ready
          select pg_sleep(2);
          commit;
          SQL
          LOCK_PID=$!
          for attempt in $(seq 1 40); do
            if [[ -f /tmp/papi-lock-ready ]]; then break; fi
            sleep 0.1
          done
          test -f /tmp/papi-lock-ready

          psql -h 127.0.0.1 -U postgres -d papi_test -At -v ON_ERROR_STOP=1 \
            -c "select public.papi_claim_job('worker-concurrent-b', gen_random_uuid(), 120)" \
            > /tmp/papi-claim-b.json
          wait "$LOCK_PID"

          psql -h 127.0.0.1 -U postgres -d papi_test -At -v ON_ERROR_STOP=1 \
            -c "select public.papi_claim_job('worker-concurrent-a', gen_random_uuid(), 120)" \
            > /tmp/papi-claim-a.json

          python - <<'PY'
          import json
          from pathlib import Path

          claim_b = json.loads(Path("/tmp/papi-claim-b.json").read_text())
          claim_a = json.loads(Path("/tmp/papi-claim-a.json").read_text())
          assert claim_b["id"] == "concurrent-second-job", claim_b
          assert claim_a["id"] == "concurrent-first-job", claim_a
          assert claim_a["attempt_id"] != claim_b["attempt_id"]
          assert claim_a["lease_token"] != claim_b["lease_token"]
          print("Concurrent PostgreSQL reservations: two distinct jobs, attempt IDs and lease tokens.")
          PY

      - name: Verify rollback on disposable PostgreSQL
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/202611170001_durable_job_attempt_ids.down.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          do $rollback$
          declare preserved_attempts integer;
          begin
            if to_regclass('public.papi_job_attempts') is not null then
              raise exception 'attempt table remains after rollback';
            end if;
            if to_regprocedure('public.papi_sync_job_attempt()') is not null then
              raise exception 'attempt synchronization trigger function remains after rollback';
            end if;
            if to_regprocedure('public.papi_renew_job(text,text,uuid,integer)') is not null then
              raise exception 'lease renewal RPC remains after rollback';
            end if;
            if exists (
              select 1 from information_schema.columns
               where table_schema = 'public' and table_name = 'papi_jobs'
                 and column_name = 'current_attempt_id'
            ) then
              raise exception 'current_attempt_id remains after rollback';
            end if;
            select attempts into preserved_attempts
              from public.papi_jobs where id = 'attempt-ci-job';
            if preserved_attempts <> 2 then
              raise exception 'original attempts counter changed during rollback';
            end if;
            if not exists (select 1 from public.papi_jobs where id = 'legacy-done-job') then
              raise exception 'legacy job was removed during rollback';
            end if;
          end;
          $rollback$;
          SQL
