name: PAPI core tests

on:
  push:
    branches: [main, "mission-*"]
  pull_request:
    branches: [main, "mission-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: papi_test_password
          POSTGRES_DB: papi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate registries
        run: PYTHONPATH=runtime python -m papi_core validate
      - name: Run unit tests
        run: PYTHONPATH=runtime python -m unittest discover -s tests -v

      - name: Apply Supabase schema to disposable PostgreSQL
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/schema.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/005_collaboration_pagination_idempotency.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/005_collaboration_pagination_idempotency.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/006_execution_queue_health.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/007_queue_transition_integrity.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SHARED_COLLAB_SQL'
          insert into public.papi_memory_events(
            event_id, memory_id, event_type, created_at, actor, category, title,
            content, source_type, source_id, confidence, scope, tags, sensitivity, idempotency_key
          ) values (
            gen_random_uuid(), gen_random_uuid(), 'remember', now(), 'ci-agent',
            'fact', 'CI memory', 'Disposable database contract test.',
            'test', 'ci-004', 0.9, 'shared', array['ci'], 'normal', 'ci-memory-key-0001'
          );
          insert into public.papi_chat_messages(
            message_id, sent_at, sender, recipient, subject, body, message_type, idempotency_key
          ) values (
            'MSG-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA', now(), 'ci-agent', 'all',
            'CI message', 'Disposable database contract test.', 'info', 'ci-message-key-0001'
          );
          do $idempotency$
          begin
            begin
              insert into public.papi_chat_messages(
                message_id, sent_at, sender, recipient, subject, body, message_type, idempotency_key
              ) values (
                'MSG-BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB', now(), 'ci-agent', 'all',
                'Duplicate', 'Must be rejected by unique idempotency key.', 'info', 'ci-message-key-0001'
              );
              raise exception 'Duplicate idempotency key was accepted';
            exception when unique_violation then
              null;
            end;
          end
          $idempotency$;
          do $privileges$
          begin
            if not has_table_privilege('service_role', 'public.papi_memory_events', 'insert')
               or not has_table_privilege('service_role', 'public.papi_chat_messages', 'select')
               or has_table_privilege('anon', 'public.papi_memory_events', 'select')
               or has_table_privilege('authenticated', 'public.papi_chat_messages', 'select')
               or has_table_privilege('service_role', 'public.papi_chat_messages', 'update')
               or has_table_privilege('service_role', 'public.papi_memory_events', 'delete') then
              raise exception 'Shared collaboration table privileges are too broad or incomplete';
            end if;
          end
          $privileges$;
          do $immutable$
          begin
            begin
              update public.papi_chat_messages set body = body
               where message_id = 'MSG-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
              raise exception 'Append-only chat UPDATE was accepted';
            exception when sqlstate '55000' then
              null;
            end;
            begin
              delete from public.papi_memory_events where actor = 'ci-agent';
              raise exception 'Append-only memory DELETE was accepted';
            exception when sqlstate '55000' then
              null;
            end;
          end
          $immutable$;
          SHARED_COLLAB_SQL
          if psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration_down.sql; then
            echo "Populated shared-collaboration rollback unexpectedly succeeded" >&2
            exit 1
          fi
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SHARED_GUARD_SQL'
          do $guard$
          begin
            if not exists (select 1 from public.papi_memory_events where actor = 'ci-agent')
               or not exists (select 1 from public.papi_chat_messages where recipient = 'all') then
              raise exception 'Refused rollback changed existing shared records';
            end if;
          end
          $guard$;
          SHARED_GUARD_SQL
          createdb -h 127.0.0.1 -U postgres papi_shared_migration_test
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/005_collaboration_pagination_idempotency.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/005_collaboration_pagination_idempotency_down.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration_down.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 <<'SHARED_ROLLBACK_SQL'
          do $rollbackcheck$
          begin
            if to_regclass('public.papi_memory_events') is not null
               or to_regclass('public.papi_chat_messages') is not null
               or to_regprocedure('public.papi_reject_append_only_mutation()') is not null then
              raise exception 'Clean shared collaboration rollback left objects behind';
            end if;
          end
          $rollbackcheck$;
          SHARED_ROLLBACK_SQL
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/005_collaboration_pagination_idempotency.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as first_use \gset
          \if :first_use
          \else
            \quit 1
          \endif
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as replay_use \gset
          \if :replay_use
            \quit 1
          \endif
          SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/test_worker_sync.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/test_worker_event_validation.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/test_execution_queue.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/test_execution_queue_idempotency.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/test_execution_queue_health.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/test_queue_transition_integrity.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f tests/sql/prepare_execution_queue_concurrency.sql
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=papi_test PGPASSWORD=papi_test_password \
            bash tests/sql/test_execution_queue_concurrency.sh

  local-postgrest-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Start isolated local PostgreSQL
        run: docker compose -f infra/supabase/local/docker-compose.yml up -d --wait postgres
      - name: Apply schema and collaboration migrations
        env:
          PGPASSWORD: papi_local_only_password
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 55432 -U postgres -d papi_contract_test && break
            sleep 2
          done
          psql -h 127.0.0.1 -p 55432 -U postgres -d papi_contract_test -v ON_ERROR_STOP=1 -f infra/supabase/schema.sql
          psql -h 127.0.0.1 -p 55432 -U postgres -d papi_contract_test -v ON_ERROR_STOP=1 -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -p 55432 -U postgres -d papi_contract_test -v ON_ERROR_STOP=1 -f infra/supabase/migrations/005_collaboration_pagination_idempotency.sql
      - name: Start local PostgREST
        run: |
          docker compose -f infra/supabase/local/docker-compose.yml up -d --wait postgrest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:55433/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/supabase/local/docker-compose.yml logs postgrest
          exit 1
      - name: Verify live PostgREST contracts
        run: python tests/integration/test_local_postgrest_contract.py
      - name: Stop disposable local stack
        if: always()
        run: docker compose -f infra/supabase/local/docker-compose.yml down --volumes
