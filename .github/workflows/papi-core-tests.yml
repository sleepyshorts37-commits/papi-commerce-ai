name: PAPI core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: papi_test_password
          POSTGRES_DB: papi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate registries
        run: PYTHONPATH=runtime python -m papi_core validate
      - name: Run unit tests
        run: PYTHONPATH=runtime python -m unittest discover -s tests -v

      - name: Apply Supabase schema to disposable PostgreSQL
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/schema.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as first_use \gset
          \if :first_use
          \else
            \quit 1
          \endif
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as replay_use \gset
          \if :replay_use
            \quit 1
          \endif
          select '{"schema_version":1,"journal_id":"ci-anchor","checkpoint":{"schema_version":1,"sequence":1,"head_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},"previous_record_digest":null,"key_id":"ci-test-key","signature":"test-only"}'::text as anchor_record \gset
          select encode(extensions.digest(convert_to(:'anchor_record', 'UTF8'), 'sha256'), 'hex') as anchor_digest \gset
          insert into public.papi_audit_anchor_records(journal_id, record_digest, canonical_record)
          values ('ci-anchor', :'anchor_digest', :'anchor_record');
          set role service_role;
          select public.papi_advance_audit_anchor('ci-anchor', null, :'anchor_digest') as first_anchor \gset
          \if :first_anchor
          \else
            \quit 1
          \endif
          select public.papi_advance_audit_anchor('ci-anchor', null, :'anchor_digest') as retry_anchor \gset
          \if :retry_anchor
          \else
            \quit 1
          \endif
          select latest_record_digest = :'anchor_digest' as head_matches
            from public.papi_audit_anchor_heads where journal_id = 'ci-anchor' \gset
          \if :head_matches
          \else
            \quit 1
          \endif
          reset role;
          select not has_table_privilege('anon', 'public.papi_audit_anchor_records', 'select')
             and not has_table_privilege('authenticated', 'public.papi_audit_anchor_records', 'select')
             and not has_table_privilege('service_role', 'public.papi_audit_anchor_records', 'update')
             as anchor_grants_safe \gset
          \if :anchor_grants_safe
          \else
            \quit 1
          \endif
          SQL
