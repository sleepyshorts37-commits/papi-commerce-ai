name: PAPI core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python --version
      - name: Validate registries
        run: PYTHONPATH=runtime python -m papi_core validate
      - name: Run unit tests
        run: PYTHONPATH=runtime python -m unittest discover -s tests -v
