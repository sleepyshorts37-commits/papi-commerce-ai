name: PAPI core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: papi_test_password
          POSTGRES_DB: papi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate registries
        run: PYTHONPATH=runtime python -m papi_core validate
      - name: Run unit tests
        run: PYTHONPATH=runtime python -m unittest discover -s tests -v

      - name: Apply Supabase schema to disposable PostgreSQL
        env:
          PGPASSWORD: papi_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role bypassrls;"
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/schema.sql
          # Apply and exercise shared memory/chat persistence on disposable PostgreSQL.
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SHARED_COLLAB_SQL'
          insert into public.papi_memory_events(
            event_id, memory_id, event_type, created_at, actor, category, title,
            content, source_type, source_id, confidence, scope, tags, sensitivity
          ) values (
            gen_random_uuid(), gen_random_uuid(), 'remember', now(), 'ci-agent',
            'fact', 'CI memory', 'Disposable database contract test.',
            'test', 'ci-004', 0.9, 'shared', array['ci'], 'normal'
          );
          insert into public.papi_chat_messages(
            message_id, sent_at, sender, recipient, subject, body, message_type
          ) values (
            'MSG-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA', now(), 'ci-agent', 'all',
            'CI message', 'Disposable database contract test.', 'info'
          );
          set role service_role;
          do $sharedcheck$
          begin
            if not has_table_privilege('service_role', 'public.papi_memory_events', 'insert')
               or has_table_privilege('anon', 'public.papi_memory_events', 'select')
               or has_table_privilege('authenticated', 'public.papi_chat_messages', 'select') then
              raise exception 'Shared collaboration table privileges are too broad or incomplete';
            end if;
            begin
              update public.papi_chat_messages set body = body
               where message_id = 'MSG-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
              raise exception 'Append-only chat UPDATE was accepted';
            exception when sqlstate '55000' then
              null;
            end;
            begin
              delete from public.papi_memory_events where actor = 'ci-agent';
              raise exception 'Append-only memory DELETE was accepted';
            exception when sqlstate '55000' then
              null;
            end;
          end
          $sharedcheck$;
          reset role;
          SHARED_COLLAB_SQL
          # Verify guarded clean rollback and re-application in an isolated disposable database.
          createdb -h 127.0.0.1 -U postgres papi_shared_migration_test
          # PostgreSQL roles are cluster-wide; reuse the roles created for papi_test.
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration_down.sql
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 <<'SHARED_ROLLBACK_SQL'
          do $rollbackcheck$
          begin
            if to_regclass('public.papi_memory_events') is not null
               or to_regclass('public.papi_chat_messages') is not null
               or to_regprocedure('public.papi_reject_append_only_mutation()') is not null then
              raise exception 'Clean shared collaboration rollback left objects behind';
            end if;
          end
          $rollbackcheck$;
          SHARED_ROLLBACK_SQL
          psql -h 127.0.0.1 -U postgres -d papi_shared_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/004_shared_collaboration.sql
          # Exercise the retry-aware queue RPC migration on disposable PostgreSQL.
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_002_retry_queue_integration_up.sql

          # Upgrade and rollback the claim response contract on disposable PostgreSQL.
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_003_claim_attempt_ceiling_up.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'CLAIM_CONTRACT_SQL'
          insert into public.papi_tasks(id, task, version)
          values ('ci-claim-contract-task', '{}'::jsonb, 1);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, status, max_attempts
          ) values (
            'ci-claim-contract-job', 'ci-claim-contract-task', 'test.noop',
            '{}'::jsonb, 'ci-claim-contract-key', 'queued', 7
          );
          set role service_role;
          do $claimcheck$
          declare v_claim jsonb;
          begin
            v_claim := public.papi_claim_job('ci-contract-worker', gen_random_uuid(), 120);
            if v_claim is null or (v_claim->>'max_attempts')::integer <> 7
               or (v_claim->>'attempts')::integer <> 1 then
              raise exception 'Claim RPC did not return durable attempt metadata';
            end if;
          end
          $claimcheck$;
          reset role;
          CLAIM_CONTRACT_SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_003_claim_attempt_ceiling_down.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'CLAIM_CONTRACT_SQL'
          do $claimcheck$
          begin
            if pg_get_functiondef('public.papi_claim_job(text,uuid,integer)'::regprocedure)
               like '%''max_attempts'', v_job.max_attempts%' then
              raise exception 'Claim RPC rollback did not restore prior response';
            end if;
          end
          $claimcheck$;
          CLAIM_CONTRACT_SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_003_claim_attempt_ceiling_up.sql

          # Exercise retry/permanent/attempt-ceiling transitions under service_role.
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'RETRY_QUEUE_SQL'
          insert into public.papi_tasks(id, task, version)
          values ('ci-retry-task', '{}'::jsonb, 1);
          insert into public.papi_jobs(
            id, task_id, handler, payload, idempotency_key, status,
            attempts, max_attempts, lease_owner, lease_token, lease_until
          ) values
            ('ci-retry-job', 'ci-retry-task', 'test.noop', '{}'::jsonb, 'ci-retry-key',
             'running', 2, 5, 'ci-worker', '00000000-0000-0000-0000-000000000001', now() + interval '5 minutes'),
            ('ci-permanent-job', 'ci-retry-task', 'test.noop', '{}'::jsonb, 'ci-permanent-key',
             'running', 1, 5, 'ci-worker', '00000000-0000-0000-0000-000000000002', now() + interval '5 minutes'),
            ('ci-ceiling-job', 'ci-retry-task', 'test.noop', '{}'::jsonb, 'ci-ceiling-key',
             'running', 5, 5, 'ci-worker', '00000000-0000-0000-0000-000000000003', now() + interval '5 minutes');
          set role service_role;
          do $retryqueue$
          declare v_status text;
          begin
            if has_function_privilege(
              'service_role', 'public.papi_fail_job(text,text,uuid,text)', 'EXECUTE'
            ) then
              raise exception 'Legacy retry RPC remained executable after migration';
            end if;
            if not has_function_privilege(
              'service_role', 'public.papi_fail_job(text,text,uuid,text,boolean,integer)', 'EXECUTE'
            ) then
              raise exception 'Retry-aware RPC is not executable by service_role';
            end if;
            v_status := public.papi_fail_job(
              'ci-retry-job', 'ci-worker',
              '00000000-0000-0000-0000-000000000001',
              'service_timeout', true, 30
            );
            if v_status <> 'retry' or not exists (
              select 1 from public.papi_jobs
               where id = 'ci-retry-job' and status = 'retry'
                 and available_at >= now() + interval '25 seconds'
            ) then
              raise exception 'Transient failure was not scheduled for bounded retry';
            end if;

            v_status := public.papi_fail_job(
              'ci-permanent-job', 'ci-worker',
              '00000000-0000-0000-0000-000000000002',
              'permission_denied', false, 0
            );
            if v_status <> 'failed' then
              raise exception 'Permanent error was incorrectly retried';
            end if;

            v_status := public.papi_fail_job(
              'ci-ceiling-job', 'ci-worker',
              '00000000-0000-0000-0000-000000000003',
              'service_timeout', true, 30
            );
            if v_status <> 'failed' then
              raise exception 'Attempt ceiling was not enforced by PostgreSQL';
            end if;
          end
          $retryqueue$;
          reset role;
          RETRY_QUEUE_SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'RETRY_MIGRATION_SQL'
          do $retrycheck$
          begin
            if to_regprocedure('public.papi_fail_job(text,text,uuid,text,boolean,integer)') is null then
              raise exception 'Retry-aware queue RPC missing after migration';
            end if;
          end
          $retrycheck$;
          RETRY_MIGRATION_SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_002_retry_queue_integration_down.sql
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'RETRY_MIGRATION_SQL'
          do $retrycheck$
          begin
            if to_regprocedure('public.papi_fail_job(text,text,uuid,text,boolean,integer)') is not null then
              raise exception 'Retry-aware queue RPC remained after rollback';
            end if;
            if not has_function_privilege(
              'service_role', 'public.papi_fail_job(text,text,uuid,text)', 'EXECUTE'
            ) then
              raise exception 'Legacy queue RPC permission was not restored by rollback';
            end if;
          end
          $retrycheck$;
          RETRY_MIGRATION_SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_002_retry_queue_integration_up.sql


          # Exercise the versioned migration lifecycle in a second disposable database.
          createdb -h 127.0.0.1 -U postgres papi_migration_test
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_001_audit_anchor_up.sql
          # Re-application must be idempotent.
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_001_audit_anchor_up.sql
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_001_audit_anchor_down.sql
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 <<'MIGRATION_SQL'
          do $migrationassert$
          begin
            if to_regclass('public.papi_audit_anchor_records') is not null
               or to_regclass('public.papi_audit_anchor_heads') is not null then
              raise exception 'Clean rollback left audit anchor tables behind';
            end if;
          end
          $migrationassert$;
          MIGRATION_SQL
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_001_audit_anchor_up.sql
          # A populated rollback must fail atomically and leave the evidence intact.
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 <<'MIGRATION_SQL'
          insert into public.papi_audit_anchor_records(journal_id, record_digest, canonical_record)
          values ('migration-guard', repeat('a', 64), '{"migration_test":true}');
          MIGRATION_SQL
          if psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations/20261113_001_audit_anchor_down.sql; then
            echo "Populated rollback unexpectedly succeeded" >&2
            exit 1
          fi
          psql -h 127.0.0.1 -U postgres -d papi_migration_test -v ON_ERROR_STOP=1 <<'MIGRATION_SQL'
          do $migrationassert$
          begin
            if not exists (select 1 from public.papi_audit_anchor_records where journal_id = 'migration-guard')
               or to_regprocedure('public.papi_advance_audit_anchor(text,text,text)') is null then
              raise exception 'Refused rollback changed or removed existing evidence';
            end if;
          end
          $migrationassert$;
          MIGRATION_SQL
          psql -h 127.0.0.1 -U postgres -d papi_test -v ON_ERROR_STOP=1 <<'SQL'
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as first_use \gset
          \if :first_use
          \else
            \quit 1
          \endif
          select public.papi_consume_agent_nonce(
            'ci-agent', 'nonce-ci-000000000001', now() + interval '5 minutes'
          ) as replay_use \gset
          \if :replay_use
            \quit 1
          \endif
          select set_config(
            'papi.ci_anchor_record',
            '{"schema_version":1,"journal_id":"ci-anchor","checkpoint":{"schema_version":1,"sequence":1,"head_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},"previous_record_digest":null,"key_id":"ci-test-key","signature":"test-only"}',
            false
          );
          select set_config(
            'papi.ci_anchor_digest',
            encode(extensions.digest(convert_to(current_setting('papi.ci_anchor_record'), 'UTF8'), 'sha256'), 'hex'),
            false
          );
          insert into public.papi_audit_anchor_records(journal_id, record_digest, canonical_record)
          values ('ci-anchor', current_setting('papi.ci_anchor_digest'), current_setting('papi.ci_anchor_record'));
          set role service_role;
          do $anchorcheck$
          declare
            v_digest text := current_setting('papi.ci_anchor_digest');
            v_result boolean;
          begin
            v_result := public.papi_advance_audit_anchor('ci-anchor', null, v_digest);
            if v_result is distinct from true then
              raise exception 'First audit anchor publication was not confirmed';
            end if;
            v_result := public.papi_advance_audit_anchor('ci-anchor', null, v_digest);
            if v_result is distinct from true then
              raise exception 'Idempotent audit anchor retry was not confirmed';
            end if;
            if not exists (
              select 1 from public.papi_audit_anchor_heads
               where journal_id = 'ci-anchor'
                 and latest_record_digest = v_digest
                 and sequence = 1
            ) then
              raise exception 'Audit anchor head does not match published record';
            end if;
          end
          $anchorcheck$;
          reset role;
          do $ci$
          declare
            v_record jsonb;
            v_canonical text;
            v_digest text;
          begin
            -- The SECURITY DEFINER RPC must reject unsupported envelope versions.
            v_record := jsonb_build_object(
              'schema_version', 99,
              'journal_id', 'ci-invalid-anchor',
              'checkpoint', jsonb_build_object(
                'schema_version', 1, 'sequence', 1,
                'head_hash', repeat('b', 64)
              ),
              'previous_record_digest', null,
              'key_id', 'ci-test-key',
              'signature', 'test-only'
            );
            v_canonical := v_record::text;
            v_digest := encode(
              extensions.digest(convert_to(v_canonical, 'UTF8'), 'sha256'), 'hex'
            );
            insert into public.papi_audit_anchor_records(
              journal_id, record_digest, canonical_record
            ) values ('ci-invalid-anchor', v_digest, v_canonical);
            perform set_config('papi.ci_invalid_anchor_digest', v_digest, false);

          end
          $ci$;
          set role service_role;
          do $ci$
          begin
            perform public.papi_advance_audit_anchor(
              'ci-invalid-anchor',
              null,
              current_setting('papi.ci_invalid_anchor_digest', true)
            );
            raise exception 'Unsupported audit record schema was accepted';
          exception when sqlstate '22023' then
            null;
          end
          $ci$;
          reset role;
          do $immutable$
          begin
            begin
              update public.papi_audit_anchor_records
                 set canonical_record = canonical_record
               where journal_id = 'ci-anchor';
              raise exception 'Immutable audit record UPDATE was accepted';
            exception when sqlstate '55000' then
              null;
            end;
            begin
              delete from public.papi_audit_anchor_records
               where journal_id = 'ci-anchor';
              raise exception 'Immutable audit record DELETE was accepted';
            exception when sqlstate '55000' then
              null;
            end;
          end
          $immutable$;
          do $check$
          begin
            if has_table_privilege('anon', 'public.papi_audit_anchor_records', 'select')
               or has_table_privilege('authenticated', 'public.papi_audit_anchor_records', 'select')
               or has_table_privilege('service_role', 'public.papi_audit_anchor_records', 'update') then
              raise exception 'Audit anchor table privileges are too broad';
            end if;
          end
          $check$;
