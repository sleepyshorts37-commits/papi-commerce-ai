name: PAPI documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify core documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/ORGANISATION.md
            docs/GOUVERNANCE-SECURITE.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/SALES-TOOLS.md
            docs/FINANCE-LEDGER.md
            docs/SECURITY-RELEASE.md
            docs/PRODUCTION-READINESS-GATE.md
            agents/ASTOU.md
            agents/MARIETOU.md
            agents/IBRAHIMA.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          echo "PAPI foundation and production-gate documents are present."
