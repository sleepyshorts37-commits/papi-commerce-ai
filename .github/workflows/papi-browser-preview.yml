name: PAPI browser preview tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser-test.txt
      - name: Install project and browser-test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-browser-test.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser preview smoke tests
        env:
          PYTHONPATH: runtime
        run: python -m unittest discover -s tests/browser -v
