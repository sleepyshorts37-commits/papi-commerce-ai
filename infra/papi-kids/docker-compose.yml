services:
  papi-kids-api:
    build:
      context: ../..
      dockerfile: infra/papi-kids/Dockerfile
    image: papi-kids:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAPI_KIDS_PRIVATE_STORAGE_DIR: /data/private
    expose:
      - "8000"
    volumes:
      - papi-kids-private:/data/private
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  papi-kids-worker:
    image: papi-kids:local
    profiles: ["worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAPI_KIDS_PRIVATE_STORAGE_DIR: /data/private
      PAPI_KIDS_WORKER_ENABLED: "true"
    command: ["python", "-m", "papi_core.papi_kids_worker_service"]
    volumes:
      - papi-kids-private:/data/private
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  papi-kids-backup:
    build:
      context: ../..
      dockerfile: infra/papi-kids/Backup.Dockerfile
    image: papi-kids-backup:local
    profiles: ["backup"]
    env_file:
      - .env
    environment:
      PAPI_KIDS_BACKUP_DIRECTORY: /data/backups
    volumes:
      - papi-kids-backups:/data/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  papi-kids-private:
    driver: local
  papi-kids-backups:
    driver: local
