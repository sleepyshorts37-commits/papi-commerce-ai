services:
  postgres:
    image: postgres:16
    container_name: papi-supabase-contract-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: papi_local_only_password
      POSTGRES_DB: papi_contract_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papi_contract_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v12.2.12
    container_name: papi-supabase-contract-rest
    environment:
      PGRST_DB_URI: postgres://postgres:papi_local_only_password@postgres:5432/papi_contract_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: papi_local_only_jwt_secret_change_before_any_nonlocal_use
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:55433:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
